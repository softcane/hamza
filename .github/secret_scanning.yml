# Hamza is a secret detector. Its rule-parity corpus is, by construction, a
# collection of secret-shaped strings: every file under rulepack-corpus/ holds
# the synthetic true-positive and false-positive vectors that prove one rule
# still matches what it is supposed to match.
#
# These are upstream Gitleaks and Betterleaks test vectors, not credentials.
# None of them authenticate against anything. Scanning them produces one alert
# per fixture and no signal, so the corpus is excluded here.
#
# Nothing else is excluded. A real credential committed anywhere outside this
# path should still raise an alert.
paths-ignore:
  - "src/test/resources/scanner/rulepack-corpus/**"
