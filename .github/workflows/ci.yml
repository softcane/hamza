name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mvn verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pom.xml enforces [25,26) via maven-enforcer-plugin.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Runs the test suite plus spotless, checkstyle, SpotBugs, and the JaCoCo
      # 80% line / 70% branch floor. Compilation is -Xlint:all -Werror.
      - name: Build and verify
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore
