# Integration topology for the deterministic M4 gate only.
#
# The pinned digest and every container hardening control match the M3 feasibility
# stack. The one difference is the network: the gate's Gate runs as a host JVM, and a
# host process cannot reach a container on an `internal: true` network, so the
# Analyzer publishes a loopback-only port here.
#
# Egress denial is therefore NOT claimed by this file. It is proved twice elsewhere:
#   - detector/presidio/compose.yaml (M3 gate) runs the same digest on an internal
#     network and asserts external Egress fails;
#   - docker-compose.yml runs the product topology, where Presidio sits on the
#     internal `control` network with no published port and no route off the host.
services:
  analyzer:
    image: ghcr.io/data-privacy-stack/presidio-analyzer@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
    pull_policy: missing
    user: "1001:1001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      LOG_LEVEL: ERROR
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_VISIBLE_DEVICES: ""
      WORKERS: "1"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:${HAMZA_PRESIDIO_GATE_PORT:-13100}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health >/dev/null"]
      interval: 2s
      timeout: 1s
      retries: 60
      start_period: 5s
    cpus: 2.0
    mem_limit: 2g
