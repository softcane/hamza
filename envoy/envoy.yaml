# Envoy front proxy for Hamza (the Gate's data plane).
#
# Dev topology: plain HTTP listener on :10000. Agents point their base URL at
# http://127.0.0.1:10000. ext_proc streams each Turn to hamza-core; the request is
# then forwarded to the upstream Provider over TLS.
#
# This file targets the real Anthropic and OpenAI endpoints and works as shipped —
# no edit is needed before routing real Agent traffic. Requests are routed to a
# Provider by path, so Claude Code and Codex can share one Gate. Automated tests
# use envoy/envoy.ci.yaml instead, via docker-compose.ci.yml.

admin:
  # Container-internal bind. Compose/Helm expose this only on loopback or cluster-internal
  # Services; do not publish Envoy admin directly on an untrusted interface.
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        # Production listener TLS/mTLS is surfaced in deploy/helm/hamza values. The dev
        # compose topology intentionally stays plain HTTP on 127.0.0.1 so local Agents can
        # use a base-URL override without local certificate bootstrapping.
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: hamza_http
                # Model turns stream for a long time; do not cut them mid-response.
                stream_idle_timeout: 300s
                # Independent ledger #2 for attestation coverage (PRD R4.2, ADR 0015).
                # Content-free by construction: method/path/status, routed cluster,
                # response detail, request id, and byte counts only — never headers or
                # bodies. One JSON object per line to stdout; the attestation reporter
                # reconciles provider-bound upstream responses against Gate Records. The
                # `log: access` marker lets the harness separate these lines from Envoy's
                # operational logs.
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          log: "access"
                          start_time: "%START_TIME(%Y-%m-%dT%H:%M:%E3SZ)%"
                          method: "%REQ(:METHOD)%"
                          # Truncated: bounds what a URL can carry into the log
                          # (query strings are additionally stripped at parse time).
                          path: "%REQ(:PATH):128%"
                          response_code: "%RESPONSE_CODE%"
                          response_code_details: "%RESPONSE_CODE_DETAILS%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          bytes_received: "%BYTES_RECEIVED%"
                          bytes_sent: "%BYTES_SENT%"
                http_filters:
                  # ext_proc runs BEFORE the router so it can mutate/block before egress.
                  # Envoy overwrites this fixed internal hint so even pathless Provider
                  # probes select an Adapter; a later filter removes it before Egress.
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: x-hamza-route-provider
                          - append:
                              header: { key: x-hamza-route-provider, value: openai }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: hamza_core
                      # Per-message timeout (not per-stream).
                      message_timeout: 10s
                      # Fail-open: if hamza-core is slow/down, traffic still flows
                      # (uptime over inspection). Hard-block rules are enforced by
                      # hamza-core via immediate_response, not by this flag.
                      failure_mode_allow: true
                      allow_mode_override: true
                      processing_mode:
                        request_header_mode: SEND
                        # BUFFERED sends the complete body to hamza-core, which is what
                        # makes MASK reachable: a partial body cannot be safely rewritten,
                        # so under BUFFERED_PARTIAL every real Agent Turn (150-200 KiB,
                        # well past a 64 KiB prefix) degraded to a FLAG-only `oversize`
                        # Finding and egressed unmasked. The cost is that a body above the
                        # route cap below now returns a local 413 instead of being
                        # forwarded partly inspected — the Gate fails loud rather than
                        # leaking. Matches managed_listener, which has always run BUFFERED.
                        request_body_mode: BUFFERED
                        response_header_mode: SEND
                        response_body_mode: STREAMED
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: x-hamza-route-provider
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: hamza_vhost
                      domains: ["*"]
                      routes:
                        # Direct health check for the listener itself.
                        - match: { path: "/ready" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ready\n" }
                        # Everything else is forwarded to a Provider upstream, selected by
                        # path so Claude Code and Codex can share this listener. The 16 MiB
                        # buffer admits a whole Agent Turn so ext_proc can mask it.
                        # Claude Code -> Anthropic Messages API.
                        - match: { prefix: "/v1/messages" }
                          per_request_buffer_limit_bytes: 16777216
                          request_headers_to_add:
                            - header:
                                key: accept-encoding
                                value: identity
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          route:
                            cluster: anthropic_upstream
                            host_rewrite_literal: api.anthropic.com
                            timeout: 300s
                        # Codex over ChatGPT auth -> chatgpt.com backend.
                        - match: { prefix: "/backend-api" }
                          per_request_buffer_limit_bytes: 16777216
                          request_headers_to_add:
                            - header:
                                key: accept-encoding
                                value: identity
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          route:
                            cluster: chatgpt_upstream
                            host_rewrite_literal: chatgpt.com
                            timeout: 300s
                        # Codex over an OpenAI API key -> Responses API.
                        - match: { prefix: "/v1/responses" }
                          per_request_buffer_limit_bytes: 16777216
                          request_headers_to_add:
                            - header:
                                key: accept-encoding
                                value: identity
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          route:
                            cluster: openai_upstream
                            host_rewrite_literal: api.openai.com
                            timeout: 300s
                        # Catch-all: CLI connectivity probes (HEAD /api/hello) and token counting.
                        - match: { prefix: "/" }
                          per_request_buffer_limit_bytes: 16777216
                          request_headers_to_add:
                            - header:
                                key: accept-encoding
                                value: identity
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          route:
                            cluster: anthropic_upstream
                            host_rewrite_literal: api.anthropic.com
                            timeout: 300s

    # Explicit managed enforcement listener. Unlike :10000, this route is fail-closed
    # if hamza-core is unavailable and buffers the complete body before ext_proc. The
    # 16 MiB Envoy bound is deliberately above Hamza's default 8 MiB admission bound so
    # an unknown-length body crossing Hamza's limit reaches the Gate and receives an
    # audited Block rather than leaking or becoming a local 413.
    - name: managed_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 10001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: hamza_managed_http
                stream_idle_timeout: 300s
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          log: "access"
                          route: "managed"
                          start_time: "%START_TIME(%Y-%m-%dT%H:%M:%E3SZ)%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(:PATH):128%"
                          response_code: "%RESPONSE_CODE%"
                          response_code_details: "%RESPONSE_CODE_DETAILS%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          bytes_received: "%BYTES_RECEIVED%"
                          bytes_sent: "%BYTES_SENT%"
                http_filters:
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: x-hamza-route-provider
                          - append:
                              header: { key: x-hamza-route-provider, value: openai }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: hamza_core
                      message_timeout: 10s
                      failure_mode_allow: false
                      allow_mode_override: true
                      processing_mode:
                        request_header_mode: SEND
                        request_body_mode: BUFFERED
                        response_header_mode: SEND
                        response_body_mode: STREAMED
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: x-hamza-route-provider
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: managed_route
                  virtual_hosts:
                    - name: hamza_managed_vhost
                      domains: ["*"]
                      routes:
                        - match: { path: "/ready" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ready\n" }
                        # ext_proc has already authenticated the complete managed
                        # metadata tuple and removed the internal headers before
                        # route matching. Requiring the signature here would reject
                        # every successfully verified Turn.
                        # Claude Code -> Anthropic Messages API.
                        - match: { prefix: "/v1/messages" }
                          per_request_buffer_limit_bytes: 16777216
                          request_headers_to_add:
                            - header:
                                key: accept-encoding
                                value: identity
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          route:
                            cluster: anthropic_upstream
                            host_rewrite_literal: api.anthropic.com
                            timeout: 300s
                        # Codex over ChatGPT auth -> chatgpt.com backend.
                        - match: { prefix: "/backend-api" }
                          per_request_buffer_limit_bytes: 16777216
                          request_headers_to_add:
                            - header:
                                key: accept-encoding
                                value: identity
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          route:
                            cluster: chatgpt_upstream
                            host_rewrite_literal: chatgpt.com
                            timeout: 300s
                        # Codex over an OpenAI API key -> Responses API.
                        - match: { prefix: "/v1/responses" }
                          per_request_buffer_limit_bytes: 16777216
                          request_headers_to_add:
                            - header:
                                key: accept-encoding
                                value: identity
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          route:
                            cluster: openai_upstream
                            host_rewrite_literal: api.openai.com
                            timeout: 300s
                        # Catch-all: CLI connectivity probes (HEAD /api/hello) and token counting.
                        - match: { prefix: "/" }
                          per_request_buffer_limit_bytes: 16777216
                          request_headers_to_add:
                            - header:
                                key: accept-encoding
                                value: identity
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          route:
                            cluster: anthropic_upstream
                            host_rewrite_literal: api.anthropic.com
                            timeout: 300s
                        - match: { prefix: "/" }
                          direct_response:
                            status: 403
                            body: { inline_string: "managed metadata required\n" }

  clusters:
    # hamza-core ext_proc gRPC server (HTTP/2 cleartext).
    - name: hamza_core
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: hamza_core
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: hamza-core, port_value: 9090 }

    # Real Provider upstreams over TLS, verified against the system CA bundle.
    # Routes above select one by request path, so Claude Code and Codex can both
    # use the Gate at the same time. AccessLogReconciler.PROVIDER_CLUSTERS must
    # list every cluster named here, or attestation stops counting its Egress.
    - name: anthropic_upstream
      type: STRICT_DNS
      # The compose bridge network has no IPv6 egress; api.anthropic.com
      # and chatgpt.com both resolve AAAA-first, which fails to connect.
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      common_http_protocol_options: { max_requests_per_connection: 1 }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: api.anthropic.com
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher: { exact: api.anthropic.com }
      load_assignment:
        cluster_name: anthropic_upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: api.anthropic.com, port_value: 443 }
    - name: chatgpt_upstream
      type: STRICT_DNS
      # The compose bridge network has no IPv6 egress; api.anthropic.com
      # and chatgpt.com both resolve AAAA-first, which fails to connect.
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      common_http_protocol_options: { max_requests_per_connection: 1 }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: chatgpt.com
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher: { exact: chatgpt.com }
      load_assignment:
        cluster_name: chatgpt_upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: chatgpt.com, port_value: 443 }
    - name: openai_upstream
      type: STRICT_DNS
      # The compose bridge network has no IPv6 egress; api.anthropic.com
      # and chatgpt.com both resolve AAAA-first, which fails to connect.
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      common_http_protocol_options: { max_requests_per_connection: 1 }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: api.openai.com
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher: { exact: api.openai.com }
      load_assignment:
        cluster_name: openai_upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: api.openai.com, port_value: 443 }
